<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传文件 - {{ site_title }}</title>
    <link rel="stylesheet" href="/static/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .upload-box {
            background: white;
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--box-shadow);
            max-width: 800px;
            margin: 2rem auto;
        }

        .dropzone {
            display: block;
            width: 100%;
            border: 2px dashed var(--secondary-color);
            border-radius: var(--border-radius);
            padding: 3rem 2rem;
            text-align: center;
            color: var(--secondary-color);
            background: #f9f9f9;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .dropzone.hover {
            background: #e8f5e9;
            border-color: var(--primary-light);
        }

        .dropzone i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .file-list {
            margin-top: 1rem;
            display: none;
        }

        .file-item {
            background: #f9f9f9;
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: #666;
            font-size: 0.9rem;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-light);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .status {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status.uploading { color: var(--primary-color); }
        .status.success { color: #2e7d32; }
        .status.error { color: #c62828; }

        .form-group { margin-bottom: 1.5rem; }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            transition: var(--transition);
            min-height: 100px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }

        .upload-summary {
            margin-top: 1rem;
            padding: 0.8rem;
            background: #f5f5f5;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        .requirements {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .requirements ul {
            margin-top: 0.5rem;
            padding-left: 1.5rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover { text-decoration: underline; }
        .back-link i { margin-right: 0.5rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 2rem;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: modalopen 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalopen {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header { margin-bottom: 1rem; }
        .modal-header h2 { margin: 0; font-size: 1.5rem; }
        .modal-header h2.success { color: var(--primary-color); }
        .modal-header h2.error { color: #c62828; }

        .modal-body { margin-bottom: 1.5rem; color: #555; }
        
        .modal-footer { text-align: right; }
        
        .close-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .close-btn:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-box">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>

            <h1 style="text-align: center; margin-bottom: 2rem;">上传临时文件</h1>

            <form method="post" enctype="multipart/form-data" id="uploadForm">
                <div class="form-group">
                    <label for="file" class="dropzone" id="dropzone">
                        <i class="fas fa-cloud-upload-alt"></i><br>
                        点击或拖拽文件到这里上传 (支持多选)
                    </label>
                    <input type="file" name="file" id="file" required multiple style="display: none;">

                    <div class="file-list" id="file-list"></div>
                </div>

                <div class="form-group">
                    <label for="description">文件描述 (可选)</label>
                    <textarea name="description" id="description" placeholder="请输入文件描述..."></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;"><i class="fas fa-upload"></i> 上传文件</button>

                <div class="upload-summary" id="upload-summary">
                    <span id="upload-count">0</span> 个文件正在上传，已完成 <span id="completed-count">0</span> 个
                </div>
            </form>

            <div class="requirements">
                <strong>上传说明:</strong>
                <ul>
                    <li>文件将在24小时后自动删除</li>
                    <li>系统会记录上传者IP和设备信息</li>
                    <li>支持同时上传多个文件</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">提示</h2>
            </div>
            <div class="modal-body">
                <p id="modalMessage">这里是消息内容</p>
            </div>
            <div class="modal-footer">
                <button class="close-btn" id="modalCloseBtn">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/upload.js"></script>
</body>
</html>
